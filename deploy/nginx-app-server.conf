# ==============================================================================
# SalesmanPro Universal Application Server Nginx Configuration
# File: /etc/nginx/sites-available/salesmanpro-app.conf
#
# PURPOSE:
# Identical, static reverse-proxy configuration for ALL application servers
# (Server 1, Server 2, Server 3, Server 4...).
#
# ZERO PER-TENANT FILES:
# Every tenant request (subdomain or custom domain) is passed through to Next.js
# with the original Host header preserved. Next.js and Redis dynamically resolve
# the tenant in real time.
# ==============================================================================

# Rate limiting zone for burst protection
limit_req_zone $binary_remote_addr zone=app_limit:10m rate=50r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Increase maximum allowable body size for media/product uploads
    client_max_body_size 64M;

    # Accommodate large authentication and session cookie headers
    large_client_header_buffers 4 32k;

    # Performance buffers
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Dedicated Health Check endpoint for local supervisor or upstream load balancer
    location /api/health {
        proxy_pass http://127.0.0.1:3000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Dedicated NextAuth API proxy: Disable buffering for instant cookie flush & minimal latency
    location /api/auth/ {
        limit_req zone=app_limit burst=100 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Static assets caching optimization (Next.js hashed files)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public static files
    location /favicon.ico {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    # Main Application Proxy: Passes original client headers to Next.js
    location / {
        limit_req zone=app_limit burst=100 nodelay;

        # Standard Security & Minimum Capability Headers
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self), usb=(), bluetooth=(), serial=(), magnetometer=(), accelerometer=(), gyroscope=(), display-capture=(), browsing-topics=(), local-network-access=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # CRITICAL: Preserve original tenant host across the proxy chain
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for long-running AI generation and streaming
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Custom Error Pages (502, 503, 504)
    error_page 502 503 504 /502.html;
    location = /502.html {
        root /var/www/salesmanpro/current/public;
        internal;
    }
}
