# ==============================================================================
# SalesmanPro Edge / Load Balancer Nginx Configuration
# File: /etc/nginx/nginx.conf (or sites-available/salesmanpro-loadbalancer.conf)
#
# PURPOSE:
# Dedicated Edge Load Balancer layer for when SalesmanPro scales to Server 1, 2, 3...
# - Terminates Wildcard TLS for *.salesmanpro.site and salesmanpro.site
# - Distributes traffic using least-connection algorithm
# - Performs active health checks against /api/health?type=readiness
# - Preserves original tenant Host headers down to application nodes
# ==============================================================================

upstream salesmanpro_cluster {
    least_conn;

    # Application Servers in pool (internal IPs or private DNS)
    server 10.0.0.11:80 max_fails=3 fail_timeout=10s; # Server 1
    server 10.0.0.12:80 max_fails=3 fail_timeout=10s; # Server 2
    server 10.0.0.13:80 max_fails=3 fail_timeout=10s; # Server 3

    keepalive 64;
}

# HTTP: Redirect all traffic to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME Challenge location for centralized Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: Wildcard Platform Domain & Subdomains
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name salesmanpro.site *.salesmanpro.site;

    # Wildcard certificates terminated at the load balancer
    ssl_certificate /etc/letsencrypt/live/salesmanpro.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salesmanpro.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:30m;
    ssl_session_timeout 1d;

    client_max_body_size 64M;
    large_client_header_buffers 4 32k;

    # Health check passthrough
    location /api/health {
        proxy_pass http://salesmanpro_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Cluster Proxy
    location / {
        proxy_pass http://salesmanpro_cluster;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Preserve original client headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # Custom Error Pages (502, 503, 504)
    error_page 502 503 504 /502.html;
    location = /502.html {
        root /var/www/salesmanpro/current/public;
        internal;
    }
}
