name: Auto Deploy Next.js to VPS (Build on Server)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy & Build on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            # Ensure directory exists and permissions are correct
            sudo mkdir -p /var/www/app
            sudo chown -R ${{ secrets.VPS_USER }}:${{ secrets.VPS_USER }} /var/www/app
            cd /var/www/app

            # 1. Initialize or Update Repository
            if [ ! -d ".git" ]; then
              echo "🚀 Repository not found. Cloning for the first time..."
              # Using a Personal Access Token or SSH is recommended for private repos
              git clone https://github.com/brendenozie/SALESMANPRO.git .
            else
              echo "📥 Pulling latest code..."
              git fetch --all
              git reset --hard origin/main
            fi

            # 2. Creating .env file
            # CRITICAL: No spaces before the variables or the closing EOT
            echo "📝 Creating .env file..."
            cat <<EOT > .env
NODE_ENV=production
NEXT_PUBLIC_BASE_URL=https://salesmanpro.site
NEXT_PUBLIC_API_URL=https://salesmanpro.site/api
NEXT_PUBLIC_PLATFORM_BASE_DOMAIN=salesmanpro.site
NEXT_PUBLIC_ADMIN_EMAIL=brendenodhiambo@gmail.com
DATABASE_URL=${{ secrets.DATABASE_URL }}
REDIS_URL=${{ secrets.REDIS_URL }}
RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}
NEXT_PUBLIC_NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
NEXT_PUBLIC_NEXTAUTH_URL=https://auth.salesmanpro.site
NEXT_PUBLIC_NEXTAUTH_URL_INTERNAL=https://auth.salesmanpro.site
NEXT_PUBLIC_MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}
NEXT_PUBLIC_RAPIDAPI_KEY=${{ secrets.RAPIDAPI_KEY }}
FIREBASE_CLIENT_API_KEY=${{ secrets.FIREBASE_CLIENT_API_KEY }}
FIREBASE_CLIENT_AUTH_DOMAIN=${{ secrets.FIREBASE_CLIENT_AUTH_DOMAIN }}
FIREBASE_CLIENT_PROJECT_ID=${{ secrets.FIREBASE_CLIENT_PROJECT_ID }}
FIREBASE_CLIENT_STORAGE_BUCKET=${{ secrets.FIREBASE_CLIENT_STORAGE_BUCKET }}
FIREBASE_CLIENT_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_CLIENT_MESSAGING_SENDER_ID }}
FIREBASE_CLIENT_APP_ID=${{ secrets.FIREBASE_CLIENT_APP_ID }}
NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
MASTER_ENCRYPTION_KEY=${{ secrets.MASTER_ENCRYPTION_KEY }}
NEXT_PUBLIC_MASTER_ENCRYPTION_KEY=${{ secrets.NEXT_PUBLIC_MASTER_ENCRYPTION_KEY }}
AWS_REGION=${{ secrets.AWS_REGION }}
AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
CLOUDFRONT_DOMAIN=${{ secrets.CLOUDFRONT_DOMAIN }}
STRIPE_PUBLIC_KEY=${{ secrets.STRIPE_PUBLIC_KEY }}
STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
STRIPE_SIGNING_SECRET=${{ secrets.STRIPE_SIGNING_SECRET }}
PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_SECRET_KEY }}
PAYSTACK_PUBLIC_KEY=${{ secrets.PAYSTACK_PUBLIC_KEY }}
MPESA_CONSUMER_KEY=${{ secrets.MPESA_CONSUMER_KEY }}
MPESA_CONSUMER_SECRET=${{ secrets.MPESA_CONSUMER_SECRET }}
MPESA_PASSKEY=${{ secrets.MPESA_PASSKEY }}
MPESA_SHORTCODE=${{ secrets.MPESA_SHORTCODE }}
GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
EMAIL=${{ secrets.EMAIL }}
EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
WHATSAPP_GATEWAY_URL=${{ secrets.WHATSAPP_GATEWAY_URL }}
WHATSAPP_API_KEY=${{ secrets.WHATSAPP_API_KEY }}
SENTRY_ENVIRONMENT=production
SENTRY_TRACES_SAMPLE_RATE=0.2
SENTRY_DSN=${{ secrets.SENTRY_DSN }}
EOT

            # 3. Build & Restart
            echo "📦 Installing dependencies..."
            npm install

            echo "🏗️ Building Next.js app..."
            # This uses your custom build command from package.json
            npm run build

            echo "🔁 Restarting Next.js server..."
            pm2 restart my-app-dev || pm2 start npm --name "my-app-dev" -- start

            echo "🎉 Deployment successful!"
          EOF