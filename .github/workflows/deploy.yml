name: 🚀 Auto Deploy Next.js to VPS

on:
  push:
    branches:
      - main # Deploy when pushing to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'

            echo "🔐 Changing to project directory..."
            cd /var/www/app

            echo "📥 Pulling latest code..."
            git pull origin main

            echo "📦 Installing dependencies..."
            # Using --legacy-peer-deps can sometimes reduce memory overhead during install
            #npm install --legacy-peer-deps
            npm ci

            echo "🏗️ Building Next.js app..."
            # Explicitly setting the memory limit here as well
            export NODE_OPTIONS="--max-old-space-size=6144"
            npm run build

            echo "🔁 Restarting Next.js server..."
            pm2 restart my-app-dev || pm2 start "npm start" --name my-app-dev
            #pm2 restart my-app-dev --update-env || pm2 start npm --name "my-app-dev" --node-args="--max-old-space-size=2048" -- start
            

            echo "🎉 Deployment successful!"
          EOF
