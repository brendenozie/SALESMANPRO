name: 🚀 Auto Deploy SalesmanPro to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          install -m 0700 -d ~/.ssh
          # Use 'printf' to preserve newlines in the private key
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Add the host to known_hosts to prevent the "Host verification" hang
          ssh-keyscan -p 24 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

          # # Ensure SSH config exists
          # mkdir -p ~/.ssh

          # cat >> ~/.ssh/config << 'EOL'
          # Host github.com
          #   Hostname ssh.github.com
          #   Port 443
          #   User git
          # EOL

          # Add GitHub to known_hosts
          # ssh-keyscan -p 443 ssh.github.com >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to VPS
        run: |
          ssh -p 24 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            # Load NVM/Node paths (Critical for non-root users)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "🔐 Changing to project directory..."
            cd /var/www/salesmanpro

            # echo "📍 Current branch:"
            #git branch

            # echo "🔍 Git status:"
            #git status

            # echo "📌 Latest commit:"
            # git log -1 --oneline

            # echo "🌐 Remote commit:"
            git fetch origin
            # git log origin/main -1 --oneline

            echo "📥 Pulling latest code..."
            ssh -T -p 443 git@ssh.github.com
            git pull origin main

            echo "📦 Installing dependencies..."
            # 'npm ci' is faster and more reliable for production
            npm ci

            # 1. Free up RAM for the build
            echo "📉 Scaling down PM2 to 1 instance..."
            pm2 scale salesmanpro 1

            echo "🏗️ Building Next.js app..."
            echo "🧹 Cleaning old build..."
            #rm -rf .next

            # Leveraging your 8GB RAM capacity
            export NODE_OPTIONS="--max-old-space-size=6144"
            npm run build

            echo "🔁 Reloading Server..."
            # Using reload instead of restart for zero-downtime
            # This looks for the name defined in your ecosystem.config.js
            pm2 reload ecosystem.config.js || pm2 start ecosystem.config.js

            # 2. Scale back up to 2 instances now that build is done
            pm2 scale salesmanpro 2
            
            # Save the PM2 state to ensure it persists after a reboot
            pm2 save

            echo "🎉 Deployment successful!"
          EOF
