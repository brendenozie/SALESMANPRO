name: 🚀 Build & Deploy SalesmanPro (Atomic Release)

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. CI BUILD JOB: All expensive compilation runs on GitHub Actions runners
  # ============================================================================
  build:
    name: 🏗️ CI Build & Artifact Creation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('app/**/*', 'components/**/*', 'lib/**/*', 'constant/**/*', 'prisma/**/*', 'workers/**/*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Worker Services
        run: npx tsc --project tsconfig.worker.json

      - name: Build Next.js Standalone
        env:
          NEXT_IS_BUILD_PHASE: 'true'
          DATABASE_URL: 'mongodb://localhost:27017/build_placeholder'
        run: |
          export NODE_OPTIONS="--max-old-space-size=6144"
          npx next build --no-lint

      - name: Assemble Standalone Bundle
        run: node scripts/pack-standalone.js

      - name: Create Release Archive
        run: |
          cd .next/standalone
          tar -czf ${{ github.workspace }}/release-${{ github.sha }}.tar.gz .
          cd ${{ github.workspace }}
          ls -lh release-${{ github.sha }}.tar.gz

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release-${{ github.sha }}.tar.gz
          retention-days: 7

  # ============================================================================
  # 2. DEPLOY JOB: Lightweight transfer, atomic symlink switch, PM2 reload, health check
  # ============================================================================
  deploy:
    name: 🚀 Production Server Deployment & Verification
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository for deploy scripts
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}

      - name: Configure SSH Key
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2222 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Transfer Release Artifact & Deployment Script
        run: |
          # Ensure remote archives and script directories exist
          ssh -p 2222 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /var/www/salesmanpro/releases/archives /var/www/salesmanpro/deploy"

          # Upload the compiled artifact
          scp -P 2222 release-${{ github.sha }}.tar.gz \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/salesmanpro/releases/archives/

          # Upload the deploy-release script
          scp -P 2222 deploy/deploy-release.sh \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/salesmanpro/deploy/deploy-release.sh

      - name: Execute Atomic Release on VPS
        run: |
          ssh -p 2222 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            chmod +x /var/www/salesmanpro/deploy/deploy-release.sh
            /var/www/salesmanpro/deploy/deploy-release.sh ${{ github.sha }}
          EOF
