# ==================================================
# HTTP → HTTPS REDIRECT
# ==================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow Let's Encrypt ACME challenges
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://$host$request_uri;
}

# ==================================================
# UNIVERSAL HTTPS PROXY (Wildcard + Fallback)
# ==================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # ----------------------------
    # Default SSL certificate (Wildcard for *.salesmanpro.site)
    # ----------------------------
    ssl_certificate     /etc/letsencrypt/live/salesmanpro.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salesmanpro.site/privkey.pem;

    # ----------------------------
    # SSL Hardening
    # ----------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ----------------------------
    # ACME Challenge Support
    # ----------------------------
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ----------------------------
    # Proxy all requests to your Next.js app
    # ----------------------------
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ==================================================
# TENANT SSL CERTIFICATE BLOCKS
# Each snippet adds its own “server { … }” section.
# These are created dynamically by your Next.js API.
# ==================================================
include /etc/nginx/snippets/ssl-*.conf;
